# ==============================================================
# Manifests Kubernetes — InfoLine API Java
# ==============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: infoline
  labels:
    app.kubernetes.io/managed-by: terraform
    environment: production

---
# ConfigMap — configuration non-sensible de l'API
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: infoline
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  LOG_LEVEL: "INFO"
  # L'URL de la Lambda login est injectée depuis Terraform via CI/CD
  AUTH_SERVICE_URL: "https://AUTH_LAMBDA_URL_PLACEHOLDER/auth"

---
# Secret — variables sensibles (injectées par CI/CD depuis Secrets Manager)
# En production, utiliser External Secrets Operator plutôt que des secrets manuels
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: infoline
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://RDS_HOST_PLACEHOLDER:5432/infoline_db"
  DB_USERNAME: "infoline_admin"
  DB_PASSWORD: "REPLACE_BY_CI_CD"
  JWT_SECRET: "REPLACE_BY_CI_CD"

---
# Deployment — API Java (dockerisée, scalable)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infoline-api
  namespace: infoline
  labels:
    app: infoline-api
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infoline-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 1 pod supplémentaire pendant la mise à jour
      maxUnavailable: 0  # Zéro downtime
  template:
    metadata:
      labels:
        app: infoline-api
        version: "1.0.0"
      annotations:
        # Force le redéploiement lors d'un nouveau push CI/CD
        rollme: "ROLLME_HASH_PLACEHOLDER"
    spec:
      serviceAccountName: infoline-api-sa

      # Affinité : distribuer les pods sur plusieurs nodes/AZ
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["infoline-api"]
                topologyKey: kubernetes.io/hostname

      containers:
        - name: api
          # Image depuis ECR — tag injecté par CI/CD
          image: AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/infoline/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: actuator

          # Variables d'environnement depuis ConfigMap et Secret
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets

          # Ressources : request = garanti, limit = plafond
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          # Probe de démarrage (laisse le temps à la JVM de démarrer)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: actuator
            failureThreshold: 30
            periodSeconds: 10

          # Probe de vivacité : redémarre le pod si l'API est bloquée
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3

          # Probe de disponibilité : retire du LB si pas prêt
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: actuator
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3

          # Arrêt propre : laisse 30s aux requêtes en cours de se terminer
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

      terminationGracePeriodSeconds: 35

---
# Service — expose l'API en interne au cluster
apiVersion: v1
kind: Service
metadata:
  name: infoline-api-svc
  namespace: infoline
  labels:
    app: infoline-api
spec:
  selector:
    app: infoline-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

---
# HorizontalPodAutoscaler — scaling automatique selon la charge CPU/mémoire
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infoline-api-hpa
  namespace: infoline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infoline-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Attendre 5min avant de scale down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
# PodDisruptionBudget — garantit min 1 pod disponible lors d'une maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: infoline-api-pdb
  namespace: infoline
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: infoline-api

---
# Ingress — routing HTTP(S) entrant via NGINX
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infoline-api-ingress
  namespace: infoline
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Rate limiting : 100 req/min par IP
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # CORS headers
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://infoline.com,https://admin.infoline.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  tls:
    - hosts:
        - api.infoline.com
      secretName: infoline-api-tls
  rules:
    - host: api.infoline.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infoline-api-svc
                port:
                  number: 80

---
# ServiceAccount avec annotation IRSA (accès AWS depuis le pod)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infoline-api-sa
  namespace: infoline
  annotations:
    # Rôle IAM attaché au pod via IRSA (ex: accès S3, Secrets Manager)
    eks.amazonaws.com/role-arn: "arn:aws:iam::AWS_ACCOUNT_ID:role/infoline-api-pod-role"
