# ==============================================================
# CI/CD Pipeline — InfoLine (GitHub Actions)
# Déploie l'API Java sur EKS + la Lambda login sur AWS
# ==============================================================

name: InfoLine CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-3
  PROJECT: infoline

jobs:

  # ------------------------------------------------------------
  # JOB 1 : Tests et build de l'API Java
  # ------------------------------------------------------------
  build-api:
    name: Build & Test Java API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test --no-transfer-progress

      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api/target/*.jar
          retention-days: 1

  # ------------------------------------------------------------
  # JOB 2 : Build et push Docker image → ECR (API)
  # ------------------------------------------------------------
  docker-push-api:
    name: Docker Build & Push API
    needs: build-api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: api/target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT }}/api
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------
  # JOB 3 : Build et upload JAR Lambda → S3
  # ------------------------------------------------------------
  deploy-lambda:
    name: Deploy Login Lambda
    needs: build-api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./lambda-login

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Lambda JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          aws s3 cp target/login-function.jar \
            s3://${{ env.PROJECT }}-prod-lambda-artifacts/login/login-function-latest.jar \
            --sse AES256

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.PROJECT }}-prod-login \
            --s3-bucket ${{ env.PROJECT }}-prod-lambda-artifacts \
            --s3-key login/login-function-latest.jar \
            --region ${{ env.AWS_REGION }}

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.PROJECT }}-prod-login

      - name: Publish new Lambda version
        run: |
          aws lambda publish-version \
            --function-name ${{ env.PROJECT }}-prod-login \
            --description "Deploy from commit ${{ github.sha }}"

  # ------------------------------------------------------------
  # JOB 4 : Déploiement Kubernetes sur EKS
  # ------------------------------------------------------------
  deploy-eks:
    name: Deploy to EKS
    needs: docker-push-api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.PROJECT }}-prod-eks

      - name: Deploy to Kubernetes
        run: |
          # Remplace le placeholder de l'image par le digest exact du build
          IMAGE_TAG=$(echo "${{ needs.docker-push-api.outputs.image-tag }}" | head -1)

          kubectl set image deployment/infoline-api \
            api=${IMAGE_TAG} \
            -n infoline

          # Patch le rollme annotation pour forcer le redéploiement
          kubectl patch deployment infoline-api \
            -n infoline \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rollme\":\"${{ github.sha }}\"}}}}}"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/infoline-api \
            -n infoline \
            --timeout=5m

      - name: Verify pods
        run: |
          kubectl get pods -n infoline -l app=infoline-api
          kubectl get hpa -n infoline

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rollout failed — rolling back..."
          kubectl rollout undo deployment/infoline-api -n infoline
